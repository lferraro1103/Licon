plugins { id 'com.android.application' }
android {
    namespace 'ar.accesospng'
    compileSdk 35
    defaultConfig { applicationId 'ar.accesospng'; minSdk 26; targetSdk 35; versionCode 3; versionName '1.2'; testInstrumentationRunner 'ar.accesospng.WidgetInstrumentation' }
    testBuildType 'release'
    def signingFile = rootProject.file('signing.properties')
    if (signingFile.exists()) {
        def keys = new Properties()
        signingFile.withInputStream { keys.load(it) }
        signingConfigs { localRelease { storeFile rootProject.file(keys['storeFile']); storePassword keys['storePassword']; keyAlias keys['keyAlias']; keyPassword keys['keyPassword'] } }
        buildTypes.release.signingConfig = signingConfigs.localRelease
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    buildTypes { release { minifyEnabled false } }
}
